services:
  - type: web
    name: ruangidb
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: ruangidb-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /app/data
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_URL
        sync: false
